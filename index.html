<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Application Tracker</title>
<style>
:root {
  --bg:#f6f7f9; --panel:#fff; --text:#20242a; --muted:#69717d;
  --border:#dfe3e8; --accent:#315f9b; --accent2:#eaf0f8;
}
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
main { max-width:1200px; margin:0 auto; padding:28px 20px 44px; }
h1 { margin:0 0 5px; font-size:28px; }
.sub { color:var(--muted); margin-bottom:22px; }
.cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:15px; }
.card .n { font-size:25px; font-weight:700; }
.card .l { color:var(--muted); font-size:13px; margin-top:3px; }
.controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
input,select,button { font:inherit; }
input,select { background:white; border:1px solid var(--border); border-radius:8px; padding:9px 11px; }
#search { flex:1 1 280px; }
button { border:1px solid var(--border); background:white; border-radius:8px; padding:9px 12px; cursor:pointer; }
button:hover { background:#f0f2f5; }
.tablewrap { overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; }
table { border-collapse:collapse; width:100%; min-width:1050px; }
th,td { text-align:left; padding:12px 11px; border-bottom:1px solid var(--border); vertical-align:top; }
th { position:sticky; top:0; background:#f1f3f6; font-size:13px; cursor:pointer; white-space:nowrap; }
tr:last-child td { border-bottom:0; }
.title { font-weight:600; }
.muted { color:var(--muted); }
.pill { display:inline-block; padding:3px 7px; border-radius:999px; font-size:12px; border:1px solid var(--border); }
.yes { background:#edf5ed; }
.no { background:#f8eeee; }
.empty { color:#9aa1aa; }
.detail { display:none; }
.detail.open { display:table-row; }
.detailbox { background:#fafbfc; padding:14px; border-top:0; }
.detailbox strong { display:block; margin-bottom:5px; }
@media (max-width:760px) {
  .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
  main { padding:20px 12px 35px; }
}
</style>
</head>
<body>
<main>
  <h1>Job Application Tracker</h1>
  <div class="sub">Interactive version of the spreadsheet data you provided.</div>

  <section class="cards">
    <div class="card"><div class="n" id="total">0</div><div class="l">Applications listed</div></div>
    <div class="card"><div class="n" id="remote">0</div><div class="l">Remote</div></div>
    <div class="card"><div class="n" id="interview">0</div><div class="l">Interview marked</div></div>
    <div class="card"><div class="n" id="followups">0</div><div class="l">Follow-ups recorded</div></div>
  </section>

  <section class="controls">
    <input id="search" type="search" placeholder="Search jobs, companies, locations, notes…">
    <select id="location"><option value="">All locations</option></select>
    <select id="status">
      <option value="">All application status</option>
      <option value="interview">Interview marked</option>
      <option value="nointerview">Interview: NO</option>
      <option value="followup">Has follow-up</option>
      <option value="nocover">No cover letter</option>
    </select>
    <button id="clear">Clear filters</button>
  </section>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th data-key="title">Job Title</th>
        <th data-key="company">Company</th>
        <th data-key="location">Location</th>
        <th data-key="applied">Applied</th>
        <th data-key="app_id">App ID</th>
        <th>Resume</th>
        <th>Cover Letter</th>
        <th>Interview</th>
        <th>Follow Up</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

let data = [...original];
let sortKey = null, sortDir = 1;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const val = s => s ? esc(s) : '<span class="empty">—</span>';

function renderLocationOptions() {
  const locations = [...new Set(data.map(x => x.location).filter(Boolean))].sort();
  document.querySelector('#location').innerHTML =
    '<option value="">All locations</option>' +
    locations.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('');
}

function render() {
  const q = document.querySelector('#search').value.trim().toLowerCase();
  const loc = document.querySelector('#location').value;
  const status = document.querySelector('#status').value;

  let rows = data.filter(x => {
    const text = Object.values(x).join(' ').toLowerCase();
    if (q && !text.includes(q)) return false;
    if (loc && x.location !== loc) return false;
    if (status === 'interview' && !x.interview) return false;
    if (status === 'nointerview' && x.interview !== 'NO') return false;
    if (status === 'followup' && !x.follow_up) return false;
    if (status === 'nocover' && x.cover_letter !== 'No') return false;
    return true;
  });

  if (sortKey) rows.sort((a,b) => String(a[sortKey] ?? '').localeCompare(String(b[sortKey] ?? ''), undefined, {numeric:true}) * sortDir);

  document.querySelector('#rows').innerHTML = rows.map((x,i) => `
    <tr>
      <td class="title">${val(x.title)}</td>
      <td>${val(x.company)}</td>
      <td>${val(x.location)}</td>
      <td>${val(x.applied)}</td>
      <td>${val(x.app_id)}</td>
      <td><span class="pill yes">${esc(x.resume)}</span></td>
      <td><span class="pill ${x.cover_letter==='No'?'no':'yes'}">${esc(x.cover_letter)}</span></td>
      <td>${x.interview ? `<span class="pill ${x.interview==='NO'?'no':'yes'}">${esc(x.interview)}</span>` : '<span class="empty">—</span>'}</td>
      <td>${x.follow_up ? '<button type="button" class="note" data-i="'+i+'">View</button>' : '<span class="empty">—</span>'}</td>
    </tr>
    <tr class="detail" id="detail-${i}"><td colspan="9"><div class="detailbox"><strong>Follow-up</strong>${val(x.follow_up)}</div></td></tr>
  `).join('');

  document.querySelectorAll('.note').forEach(btn => btn.addEventListener('click', () => {
    const row = document.querySelector('#detail-' + btn.dataset.i);
    row.classList.toggle('open');
  }));

  document.querySelector('#total').textContent = rows.length;
  document.querySelector('#remote').textContent = rows.filter(x => x.location.toLowerCase() === 'remote').length;
  document.querySelector('#interview').textContent = rows.filter(x => x.interview).length;
  document.querySelector('#followups').textContent = rows.filter(x => x.follow_up).length;
}

document.querySelector('#search').addEventListener('input', render);
document.querySelector('#location').addEventListener('change', render);
document.querySelector('#status').addEventListener('change', render);
document.querySelector('#clear').addEventListener('click', () => {
  document.querySelector('#search').value='';
  document.querySelector('#location').value='';
  document.querySelector('#status').value='';
  render();
});
document.querySelectorAll('th[data-key]').forEach(th => th.addEventListener('click', () => {
  const key = th.dataset.key;
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }

}));
